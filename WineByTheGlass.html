<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wine by the Glass — Gran Caffè L'Aquila</title>
    <meta name="description" content="Explore today's curated Italian wines poured by the glass at Gran Caffè L'Aquila in Philadelphia.">
    <link rel="icon" type="image/png" href="./image/icon-96x96.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/luxury-polish.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at 50% 0%, #1C1712 0%, #0C0B0A 52%, #080706 100%);
            color: var(--gca-ivory);
            font-family: var(--gca-font-editorial);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Sticky Top Bar */
        .page-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.85rem clamp(1rem, 4vw, 2.5rem);
            background: rgba(12, 11, 9, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gca-border);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--gca-gold);
            font-family: var(--gca-font-display);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .topbar-brand img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Framed Menu Sheet */
        .sheet-wrapper {
            width: 100%;
            max-width: 1120px;
            margin: clamp(1.5rem, 3.5vw, 2.75rem) auto 3.5rem;
            padding: 0 clamp(0.9rem, 3vw, 1.5rem);
            flex: 1;
        }

        .menu-sheet {
            position: relative;
            background: linear-gradient(170deg, rgba(24, 21, 18, 0.96) 0%, rgba(15, 13, 11, 0.98) 100%);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 18px;
            padding: clamp(1.75rem, 4.5vw, 3.5rem);
            box-shadow: 0 22px 58px rgba(0, 0, 0, 0.58);
        }

        .menu-sheet::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(212, 175, 55, 0.14);
            border-radius: 12px;
            pointer-events: none;
        }

        .sheet-header {
            text-align: center;
            padding-bottom: 1.75rem;
            margin-bottom: 1.75rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .sheet-kicker {
            font-family: var(--gca-font-ui);
            font-size: 0.74rem;
            font-weight: 500;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--gca-gold-soft);
            margin-bottom: 0.55rem;
        }

        .sheet-header h1 {
            font-family: var(--gca-font-display);
            font-size: clamp(1.9rem, 3.8vw, 2.85rem);
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gca-ivory);
            margin-bottom: 0.6rem;
        }

        .sheet-sub {
            font-family: var(--gca-font-editorial);
            font-size: 1.12rem;
            color: var(--gca-muted);
            font-style: italic;
        }

        /* Category Filter Pills */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2.25rem;
        }

        .filter-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.48rem 0.95rem;
            border-radius: 999px;
            border: 1px solid rgba(212, 175, 55, 0.24);
            background: rgba(16, 14, 12, 0.8);
            color: var(--gca-ivory);
            font-family: var(--gca-font-ui);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .filter-pill:hover {
            border-color: var(--gca-gold);
            color: var(--gca-gold-soft);
        }

        .filter-pill.active {
            background: var(--gca-gold);
            border-color: var(--gca-gold);
            color: var(--gca-bg);
            font-weight: 600;
        }

        .filter-pill-count {
            font-size: 0.7rem;
            opacity: 0.78;
        }

        /* Two-Column Menu Grid */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2.5rem 3.25rem;
        }

        .main-grid.single-col {
            grid-template-columns: minmax(0, 720px);
            justify-content: center;
        }

        .section-group {
            margin-bottom: 2.25rem;
        }

        .section-group:last-child {
            margin-bottom: 0;
        }

        .cat-title {
            font-family: var(--gca-font-display);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--gca-gold);
            padding-bottom: 0.55rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.32);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .cat-count {
            font-family: var(--gca-font-ui);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: var(--gca-muted);
            font-weight: 500;
        }

        /* Wine Entry */
        .wine-item {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 0.85rem 0.9rem;
            margin: 0 -0.9rem 0.45rem;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .wine-item:hover {
            background: rgba(212, 175, 55, 0.07);
            border-color: rgba(212, 175, 55, 0.22);
            transform: translateX(3px);
        }

        .d-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }

        .d-name {
            font-family: var(--gca-font-display);
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--gca-ivory);
            line-height: 1.35;
        }

        .wine-item:hover .d-name {
            color: var(--gca-gold-soft);
        }

        .d-vintage {
            font-family: var(--gca-font-ui);
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--gca-muted);
            margin-left: 0.35rem;
        }

        .d-price {
            font-family: var(--gca-font-ui);
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--gca-gold);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .d-submeta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem;
            margin-top: 0.25rem;
            font-family: var(--gca-font-ui);
            font-size: 0.74rem;
            color: var(--gca-muted);
            letter-spacing: 0.03em;
        }

        .d-dot {
            opacity: 0.45;
        }

        .d-desc {
            font-family: var(--gca-font-editorial);
            font-size: 1rem;
            line-height: 1.5;
            color: rgba(245, 240, 230, 0.78);
            margin-top: 0.4rem;
        }

        .loading {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--gca-muted);
            font-style: italic;
            font-size: 1.1rem;
        }

        .sheet-footer-cta {
            text-align: center;
            margin-top: 2.75rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(212, 175, 55, 0.18);
        }

        .wine-list-button {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.95rem 2rem;
            border-radius: 10px;
            background: var(--gca-gold);
            color: var(--gca-bg);
            text-decoration: none;
            font-family: var(--gca-font-display);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: background-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
        }

        .wine-list-button:hover {
            background: var(--gca-gold-soft);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(212, 175, 55, 0.28);
        }

        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .topbar-brand span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="page-topbar">
        <a href="./index.html" class="topbar-brand">
            <img src="./image/gcaLogo.png" alt="Gran Caffè L'Aquila" decoding="async">
            <span>Gran Caffè L'Aquila</span>
        </a>
        <nav class="topbar-nav" aria-label="Navigation">
            <a href="./index.html" class="gca-nav-pill">
                <svg class="gca-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1V9.5"></path></svg>
                Home
            </a>
            <a href="./wine-map.html" class="gca-nav-pill">
                <svg class="gca-ico" viewBox="0 0 24 24" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon></svg>
                Wine Atlas
            </a>
            <a href="./OurStory.html" class="gca-nav-pill">Our Story</a>
        </nav>
    </header>

    <main class="sheet-wrapper">
        <div class="menu-sheet">
            <div class="sheet-header">
                <p class="sheet-kicker">Gran Caffè L'Aquila &middot; Philadelphia</p>
                <h1>Wine by the Glass</h1>
                <p class="sheet-sub">Today's curated Italian pours &mdash; tap any selection for full tasting notes</p>
            </div>

            <div class="filter-bar" id="glassFilterBar" role="tablist" aria-label="Filter wines by style"></div>

            <div id="winesContainer" class="loading">
                Loading today's wine selection...
            </div>

            <div class="sheet-footer-cta">
                <a href="./wine-map.html" class="wine-list-button">
                    Explore Full Bottle Atlas
                    <svg class="gca-ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </a>
            </div>
        </div>
    </main>

    <script>
        const TYPE_META = [
            { key: 'BIANCO', label: 'White Wines', col: 'left' },
            { key: 'ROSATO', label: 'Rosé Wines', col: 'left' },
            { key: 'ARANCIONE', label: 'Orange Wines', col: 'left' },
            { key: 'ROSSO', label: 'Red Wines', col: 'right' },
            { key: 'BOLLICINE', label: 'Sparkling', col: 'right' },
            { key: 'NON ALCOLICO', label: 'Non-Alcoholic', col: 'right' }
        ];

        let groupedWines = {};
        let activeFilter = 'ALL';

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatPrice(raw) {
            if (raw == null) return '';
            const cleaned = String(raw).trim().replace(/^\$/, '');
            if (!cleaned) return '';
            const num = Number(cleaned);
            if (Number.isFinite(num)) {
                return '$' + num.toFixed(2);
            }
            return '$' + cleaned;
        }

        function normalizeDescription(text) {
            if (!text) return '';
            const trimmed = String(text).trim();
            if (!trimmed) return '';
            // If mostly uppercase (>70% letters uppercase), convert to clean sentence case
            const letters = trimmed.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '');
            const uppers = trimmed.replace(/[^A-ZÀ-ÖØ-Þ]/g, '');
            if (letters.length > 10 && uppers.length / letters.length > 0.7) {
                let lower = trimmed.toLowerCase();
                lower = lower.replace(/(^\s*[a-zà-öø-ÿ]|[.!?]\s+[a-zà-öø-ÿ])/g, m => m.toUpperCase());
                lower = lower.replace(/\b(docg|doc|igt|dop|abv|usa|pa)\b/gi, m => m.toUpperCase());
                return lower;
            }
            return trimmed;
        }

        function classifyWine(wine) {
            const type = (wine.wine_type || '').toUpperCase();
            const subcat = (wine.subcategory || '').toUpperCase();

            if (type.includes('BOLLICINE') || type.includes('SPARKLING') ||
                subcat.includes('BOLLICINE') || subcat.includes('SPARKLING') ||
                subcat.includes('METODO CLASSICO') || subcat.includes('CHARMAT') ||
                subcat.includes('ANCESTRAL') || subcat.includes('MARTINOTTI')) {
                return 'BOLLICINE';
            }
            if (type.includes('NON ALCOLICO') || type.includes('NON-ALCOHOLIC') || type.includes('0.0')) {
                return 'NON ALCOLICO';
            }
            if (type.includes('ROSATO') || type.includes('ROSE') || type.includes('ROSY') ||
                subcat.includes('ROSATO') || subcat === 'ROSE' || subcat === 'ROSY') {
                return 'ROSATO';
            }
            if (type.includes('ARANCIONE') || type.includes('ORANGE') ||
                subcat.includes('ARANCIONE') || subcat === 'ORANGE') {
                return 'ARANCIONE';
            }
            if (type.includes('ROSSO') || type.includes('RED') ||
                type.includes('AMARONE') || type.includes('BAROLO') ||
                type.includes('SUPERTUSCAN') || type.includes('SUPERIORE') ||
                type.includes('RIPASSO') || subcat.includes('ROSSO') || subcat === 'RED') {
                return 'ROSSO';
            }
            if (type.includes('BIANCO') || type.includes('WHITE') ||
                subcat.includes('BIANCO') || subcat === 'WHITE') {
                return 'BIANCO';
            }
            return null;
        }

        function createWineItem(wine) {
            const wineName = escapeHtml(wine.wine_name || 'Unknown Wine');
            const producer = escapeHtml(wine.wine_producer || '');
            const region = escapeHtml(wine.region || '');
            const glassPrice = formatPrice(wine.wine_price_glass);
            const bottlePrice = formatPrice(wine.wine_price_bottle || wine.wine_price);
            const description = escapeHtml(normalizeDescription(wine.wine_description || ''));
            const vintageMatch = wine.wine_vintage ? String(wine.wine_vintage).match(/\b(19|20)\d{2}\b/) : null;
            const vintage = vintageMatch ? vintageMatch[0] : '';

            const metaParts = [];
            if (producer) metaParts.push(producer);
            if (region) metaParts.push(region);
            if (bottlePrice && bottlePrice !== glassPrice) metaParts.push(`Bottle ${bottlePrice}`);

            return `
                <a class="wine-item" href="wine-details.html?id=${encodeURIComponent(wine.wine_number)}">
                    <div class="d-header">
                        <span class="d-name">${wineName}${vintage ? `<span class="d-vintage">${escapeHtml(vintage)}</span>` : ''}</span>
                        <span class="d-price">${escapeHtml(glassPrice || 'MP')}</span>
                    </div>
                    ${metaParts.length ? `<div class="d-submeta">${metaParts.join('<span class="d-dot">&middot;</span>')}</div>` : ''}
                    ${description ? `<div class="d-desc">${description}</div>` : ''}
                </a>
            `;
        }

        function renderFilterBar(totalCount) {
            const bar = document.getElementById('glassFilterBar');
            if (!bar) return;

            const pills = [
                `<button type="button" class="filter-pill ${activeFilter === 'ALL' ? 'active' : ''}" data-filter="ALL">All <span class="filter-pill-count">${totalCount}</span></button>`
            ];

            TYPE_META.forEach(t => {
                const count = (groupedWines[t.key] || []).length;
                if (count > 0) {
                    pills.push(`<button type="button" class="filter-pill ${activeFilter === t.key ? 'active' : ''}" data-filter="${t.key}">${t.label.replace(' Wines', '')} <span class="filter-pill-count">${count}</span></button>`);
                }
            });

            bar.innerHTML = pills.join('');
            bar.querySelectorAll('.filter-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeFilter = btn.dataset.filter;
                    renderFilterBar(totalCount);
                    renderWines();
                });
            });
        }

        function renderSection(meta) {
            const list = groupedWines[meta.key] || [];
            if (list.length === 0) return '';
            return `
                <section class="section-group">
                    <h2 class="cat-title">
                        <span>${meta.label}</span>
                        <span class="cat-count">${list.length} ${list.length === 1 ? 'pour' : 'pours'}</span>
                    </h2>
                    ${list.map(createWineItem).join('')}
                </section>
            `;
        }

        function renderWines() {
            const container = document.getElementById('winesContainer');
            if (!container) return;

            if (activeFilter !== 'ALL') {
                const meta = TYPE_META.find(t => t.key === activeFilter);
                container.className = '';
                container.innerHTML = `<div class="main-grid single-col">${meta ? renderSection(meta) : ''}</div>`;
                return;
            }

            const leftHtml = TYPE_META.filter(t => t.col === 'left').map(renderSection).join('');
            const rightHtml = TYPE_META.filter(t => t.col === 'right').map(renderSection).join('');

            container.className = '';
            container.innerHTML = `
                <div class="main-grid">
                    <div class="col-left">${leftHtml}</div>
                    <div class="col-right">${rightHtml}</div>
                </div>
            `;
        }

        async function loadWinesByTheGlass() {
            try {
                const response = await fetch('./data/wines.json');
                const data = await response.json();

                const winesByGlass = (data.wines || []).filter(wine =>
                    wine.wine_price_glass &&
                    String(wine.wine_price_glass).trim() !== '' &&
                    wine.wine_type &&
                    !String(wine.wine_type).toUpperCase().includes('COCKTAIL') &&
                    wine.wine_producer &&
                    !String(wine.wine_producer).toUpperCase().includes('HOUSE COCKTAIL')
                );

                if (winesByGlass.length === 0) {
                    document.getElementById('winesContainer').innerHTML =
                        '<div class="loading">No wines available by the glass at the moment.</div>';
                    return;
                }

                groupedWines = {};
                TYPE_META.forEach(t => { groupedWines[t.key] = []; });

                let matchedCount = 0;
                winesByGlass.forEach(wine => {
                    const cat = classifyWine(wine);
                    if (cat && groupedWines[cat]) {
                        groupedWines[cat].push(wine);
                        matchedCount++;
                    }
                });

                renderFilterBar(matchedCount);
                renderWines();
            } catch (error) {
                console.error('Error loading wines:', error);
                document.getElementById('winesContainer').innerHTML =
                    '<div class="loading">Unable to load wines right now. Please try again.</div>';
            }
        }

        loadWinesByTheGlass();
    </script>
</body>
</html>
